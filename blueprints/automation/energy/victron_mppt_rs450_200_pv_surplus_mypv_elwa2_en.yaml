# version: 2.0.0
blueprint:
  name: Victron MPPT RS450/200 PV Surplus Control MYPV ELWA2
  description: >-
    Controls a PV surplus load (e.g. myPV ELWA2) based on the PV surplus of a
    Victron MPPT RS450/200 via freely configurable actions (e.g. HTTP calls via
    rest_command).

    The trigger mode determines which conditions must be met:
    "LIMITED and SOC" requires both, "LIMITED only" ignores SOC,
    "SOC only" ignores MPPT mode.

    When conditions are met the enable action is executed.
    When surplus is gone the disable action is executed.

    A periodic check also repeats the appropriate action on a configurable interval.

    Example ELWA2 rest_command in configuration.yaml:
      rest_command:
        elwa2_power:
          url: "http://<IP>/control.html"
          method: GET
          params:
            power: "{{ power }}"
    Enable action: rest_command.elwa2_power with data.power=3450
    Disable action: rest_command.elwa2_power with data.power=0
  domain: automation
  source_url: https://raw.githubusercontent.com/itsh-neumeier/ha-blueprints/main/blueprints/automation/energy/victron_mppt_rs450_200_pv_surplus_mypv_elwa2_en.yaml
  author: Timo Neumeier
  input:
    battery_soc_entity:
      name: Battery State of Charge Sensor
      selector:
        entity:
          domain: sensor
    mppt_mode_entities:
      name: MPPT Operating Mode Sensors
      description: >-
        Select one or more Victron MPPT operating mode sensors.
        Ignored when trigger mode is "SOC only".
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor
    enable_action:
      name: Action on surplus
      description: >-
        Executed when surplus conditions are met (e.g.
        rest_command.elwa2_power with data.power=3450).
      selector:
        action: {}
    disable_action:
      name: Action on no surplus
      description: >-
        Executed when surplus conditions are no longer met (e.g.
        rest_command.elwa2_power with data.power=0).
      selector:
        action: {}
    battery_soc_threshold:
      name: Battery SOC threshold
      description: Ignored when trigger mode is "LIMITED only".
      default: 90
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    trigger_mode:
      name: Trigger mode
      description: Which conditions must be met to enable the load?
      default: both
      selector:
        select:
          mode: dropdown
          options:
            - label: LIMITED and SOC (default)
              value: both
            - label: LIMITED only
              value: limited_only
            - label: SOC only
              value: soc_only
    limited_for:
      name: MPPT must stay LIMITED for
      description: Ignored when trigger mode is "SOC only".
      default:
        hours: 0
        minutes: 0
        seconds: 10
      selector:
        duration: {}
    lost_surplus_for:
      name: Condition must be gone for
      default:
        hours: 0
        minutes: 0
        seconds: 30
      selector:
        duration: {}
    check_interval:
      name: Periodic check interval
      description: How often should the action be repeated?
      default: "/30"
      selector:
        select:
          mode: dropdown
          options:
            - label: Every 5 seconds
              value: "/5"
            - label: Every 10 seconds
              value: "/10"
            - label: Every 15 seconds
              value: "/15"
            - label: Every 30 seconds (default)
              value: "/30"
            - label: Every 60 seconds
              value: "/60"

mode: single

trigger_variables:
  battery_soc_entity: !input battery_soc_entity
  mppt_mode_entities: !input mppt_mode_entities
  soc_threshold: !input battery_soc_threshold
  trigger_mode: !input trigger_mode

triggers:
  - id: mppt_limited
    trigger: state
    entity_id: !input mppt_mode_entities
    to: "LIMITED"
    for: !input limited_for
  - id: soc_above
    trigger: numeric_state
    entity_id: !input battery_soc_entity
    above: !input battery_soc_threshold
  - id: surplus_lost
    trigger: template
    value_template: >-
      {{
        (trigger_mode in ['both', 'soc_only'] and
          states(battery_soc_entity) | float(0) <= soc_threshold | float(0)
        ) or
        (trigger_mode in ['both', 'limited_only'] and
          expand(mppt_mode_entities)
            | selectattr('state', 'eq', 'LIMITED')
            | list
            | count == 0
        )
      }}
    for: !input lost_surplus_for
  - id: periodic_check
    trigger: time_pattern
    seconds: !input check_interval

conditions: []

actions:
  - choose:
      # Surplus available -> execute enable action
      - conditions:
          - condition: template
            value_template: >-
              {{
                (trigger.id == 'mppt_limited' and trigger_mode in ['both', 'limited_only']) or
                (trigger.id == 'soc_above' and trigger_mode == 'soc_only') or
                trigger.id == 'periodic_check' or
                trigger.platform is none
              }}
          - condition: template
            value_template: >-
              {{
                trigger_mode == 'limited_only' or
                states(battery_soc_entity) | float(0) > soc_threshold | float(0)
              }}
          - condition: template
            value_template: >-
              {{
                trigger_mode == 'soc_only' or
                expand(mppt_mode_entities)
                  | selectattr('state', 'eq', 'LIMITED')
                  | list
                  | count > 0
              }}
        sequence: !input enable_action

      # Surplus gone -> execute disable action
      - conditions:
          - condition: template
            value_template: "{{ trigger.id in ['surplus_lost', 'periodic_check'] or trigger.platform is none }}"
          - condition: template
            value_template: >-
              {{
                (trigger_mode in ['both', 'soc_only'] and
                  states(battery_soc_entity) | float(0) <= soc_threshold | float(0)
                ) or
                (trigger_mode in ['both', 'limited_only'] and
                  expand(mppt_mode_entities)
                    | selectattr('state', 'eq', 'LIMITED')
                    | list
                    | count == 0
                )
              }}
        sequence: !input disable_action
