# version: 2.0.0
blueprint:
  name: Victron MPPT RS450/200 PV-Überschuss Steuerung MYPV ELWA2
  description: >-
    Steuert einen PV-Überschuss-Verbraucher (z. B. myPV ELWA2) basierend auf
    dem PV-Überschuss eines Victron MPPT RS450/200 über frei konfigurierbare
    Aktionen (z. B. HTTP-Befehle via rest_command).

    Der Auslösemodus bestimmt, welche Bedingungen für die Freigabe gelten:
    "LIMITED und SOC" erfordert beides, "Nur LIMITED" ignoriert den SOC,
    "Nur SOC" ignoriert den MPPT-Modus.

    Bei erfüllter Bedingung wird die konfigurierte Einschalt-Aktion ausgeführt.
    Bei weggefallenem Überschuss wird die Ausschalt-Aktion ausgeführt.

    Zusätzlich prüft die Automation zyklisch den Zustand und wiederholt die
    passende Aktion falls nötig.

    Beispiel ELWA2 rest_command in configuration.yaml:
      rest_command:
        elwa2_power:
          url: "http://<IP>/control.html"
          method: GET
          params:
            power: "{{ power }}"
    Einschalt-Aktion: rest_command.elwa2_power mit data.power=3450
    Ausschalt-Aktion: rest_command.elwa2_power mit data.power=0
  domain: automation
  source_url: https://raw.githubusercontent.com/itsh-neumeier/ha-blueprints/main/blueprints/automation/energy/victron_mppt_rs450_200_pv_surplus_mypv_elwa2_de.yaml
  author: Timo Neumeier
  input:
    battery_soc_entity:
      name: Batterie-Ladestand-Sensor
      selector:
        entity:
          domain: sensor
    mppt_mode_entities:
      name: MPPT-Betriebsmodus-Sensoren
      description: >-
        Ein oder mehrere Victron MPPT-Betriebsmodus-Sensoren auswählen.
        Wird im Modus "Nur SOC" ignoriert.
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor
    enable_action:
      name: Aktion bei Überschuss
      description: >-
        Wird ausgeführt wenn Überschuss vorhanden ist (z. B.
        rest_command.elwa2_power mit data.power=3450).
      selector:
        action: {}
    disable_action:
      name: Aktion bei kein Überschuss
      description: >-
        Wird ausgeführt wenn kein Überschuss mehr vorhanden ist (z. B.
        rest_command.elwa2_power mit data.power=0).
      selector:
        action: {}
    battery_soc_threshold:
      name: Batterie-SOC-Schwellwert
      description: Wird im Modus "Nur LIMITED" ignoriert.
      default: 90
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    trigger_mode:
      name: Auslösemodus
      description: Welche Bedingungen müssen für die Freigabe erfüllt sein?
      default: both
      selector:
        select:
          mode: dropdown
          options:
            - label: LIMITED und SOC (Standard)
              value: both
            - label: Nur LIMITED
              value: limited_only
            - label: Nur SOC
              value: soc_only
    limited_for:
      name: MPPT muss LIMITED bleiben für
      description: Wird im Modus "Nur SOC" ignoriert.
      default:
        hours: 0
        minutes: 0
        seconds: 10
      selector:
        duration: {}
    lost_surplus_for:
      name: Bedingung muss weggefallen sein für
      default:
        hours: 0
        minutes: 0
        seconds: 30
      selector:
        duration: {}
    check_interval:
      name: Zyklisches Prüfintervall
      description: Wie oft soll die Aktion zyklisch wiederholt werden?
      default: "/30"
      selector:
        select:
          mode: dropdown
          options:
            - label: Alle 5 Sekunden
              value: "/5"
            - label: Alle 10 Sekunden
              value: "/10"
            - label: Alle 15 Sekunden
              value: "/15"
            - label: Alle 30 Sekunden (Standard)
              value: "/30"
            - label: Alle 60 Sekunden
              value: "/60"

mode: single

trigger_variables:
  battery_soc_entity: !input battery_soc_entity
  mppt_mode_entities: !input mppt_mode_entities
  soc_threshold: !input battery_soc_threshold
  trigger_mode: !input trigger_mode

triggers:
  - id: mppt_limited
    trigger: state
    entity_id: !input mppt_mode_entities
    to: "LIMITED"
    for: !input limited_for
  - id: soc_above
    trigger: numeric_state
    entity_id: !input battery_soc_entity
    above: !input battery_soc_threshold
  - id: surplus_lost
    trigger: template
    value_template: >-
      {{
        (trigger_mode in ['both', 'soc_only'] and
          states(battery_soc_entity) | float(0) <= soc_threshold | float(0)
        ) or
        (trigger_mode in ['both', 'limited_only'] and
          expand(mppt_mode_entities)
            | selectattr('state', 'eq', 'LIMITED')
            | list
            | count == 0
        )
      }}
    for: !input lost_surplus_for
  - id: periodic_check
    trigger: time_pattern
    seconds: !input check_interval

conditions: []

actions:
  - choose:
      # Überschuss vorhanden -> Einschalt-Aktion ausführen
      - conditions:
          - condition: template
            value_template: >-
              {{
                (trigger.id == 'mppt_limited' and trigger_mode in ['both', 'limited_only']) or
                (trigger.id == 'soc_above' and trigger_mode == 'soc_only') or
                trigger.id == 'periodic_check' or
                trigger.platform is none
              }}
          - condition: template
            value_template: >-
              {{
                trigger_mode == 'limited_only' or
                states(battery_soc_entity) | float(0) > soc_threshold | float(0)
              }}
          - condition: template
            value_template: >-
              {{
                trigger_mode == 'soc_only' or
                expand(mppt_mode_entities)
                  | selectattr('state', 'eq', 'LIMITED')
                  | list
                  | count > 0
              }}
        sequence: !input enable_action

      # Überschuss weg -> Ausschalt-Aktion ausführen
      - conditions:
          - condition: template
            value_template: "{{ trigger.id in ['surplus_lost', 'periodic_check'] or trigger.platform is none }}"
          - condition: template
            value_template: >-
              {{
                (trigger_mode in ['both', 'soc_only'] and
                  states(battery_soc_entity) | float(0) <= soc_threshold | float(0)
                ) or
                (trigger_mode in ['both', 'limited_only'] and
                  expand(mppt_mode_entities)
                    | selectattr('state', 'eq', 'LIMITED')
                    | list
                    | count == 0
                )
              }}
        sequence: !input disable_action
